<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Echoes of Deep Water - Web Alpha</title>
    <style>
        body {
            margin: 0;
            background-color: #040a14;
            color: #fff;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #canvasContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 6px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #040a14;
        }
    </style>
</head>
<body>

    <div id="canvasContainer">
        <canvas id="gameCanvas" width="1152" height="648"></canvas>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- CONFIGURAÇÕES DO MUNDO ---
const LARGURA_MUNDO = 2500;
const ALTURA_MUNDO = 1800;

// Paleta de cores do GDD
const ABYSS_DEEP = "#040a14";
const WALL_COLOR = "#121e31";
const WALL_BORDER = "#1e3452";
const GLOW_GREEN = "#00ff8c";
const GLOW_BLUE = "#00beff";
const GLOW_RED = "#ff3c3c";

// --- ESTADOS DO JOGO ---
let teclas = {};
let partículas = [];
let sonares = [];
let obstáculos = [];
let monstros = [];
let pods = [];
let camShake = 0;
let gameOver = false;

// --- CONTROLES MOUSE/TECLADO ---
window.addEventListener("keydown", (e) => {
    teclas[e.key.toLowerCase()] = true;
    if (e.key === " " || e.code === "Space") {
        e.preventDefault();
        dispararSonar();
    }
});
window.addEventListener("keyup", (e) => {
    teclas[e.key.toLowerCase()] = false;
});

// --- ENTIDADES DO JOGO ---

class Jogador {
    constructor() {
        self = this;
        this.x = LARGURA_MUNDO / 2;
        this.y = ALTURA_MUNDO / 2;
        this.raio = 12;
        this.velocidade = 3.5;
        this.oxigenio = 100.0;
        this.angulo = 0;
        this.isMoving = false;
        this.animFrame = 0;
    }

    atualizar() {
        let dx = 0;
        let dy = 0;

        if (teclas['w'] || teclas['arrowup']) dy = -1;
        if (teclas['s'] || teclas['arrowdown']) dy = 1;
        if (teclas['a'] || teclas['arrowleft']) dx = -1;
        if (teclas['d'] || teclas['arrowright']) dx = 1;

        this.isMoving = (dx !== 0 || dy !== 0);

        if (this.isMoving) {
            // Normalizar diagonais
            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            this.angulo = Math.atan2(dy, dx);

            // Colisão no eixo X
            let oldX = this.x;
            this.x += dx * this.velocidade;
            if (this.checarColisao()) this.x = oldX;

            // Colisão no eixo Y
            let oldY = this.y;
            this.y += dy * this.velocidade;
            if (this.checarColisao()) this.y = oldY;

            this.oxigenio -= 0.04;
            
            if (Math.random() < 0.15) {
                partículas.push(new Particula(this.x, this.y, "rgba(200, 240, 255, 0.6)", 2));
            }
        } else {
            this.oxigenio -= 0.02;
        }

        this.animFrame = (this.animFrame + 0.15) % 4;
    }

    checarColisao() {
        let pRect = { x: this.x - 10, y: this.y - 10, w: 20, h: 20 };
        for (let obs of obstáculos) {
            if (pRect.x < obs.x + obs.w && pRect.x + pRect.w > obs.x &&
                pRect.y < obs.y + obs.h && pRect.y + pRect.h > obs.y) {
                return true;
            }
        }
        return false;
    }

    desenhar(camX, camY) {
        ctx.save();
        ctx.translate(this.x - camX, this.y - camY);
        ctx.rotate(this.angulo);

        // Animação procedural das nadadeiras/pernas
        let fMod = Math.sin(this.animFrame) * 4;
        ctx.fillStyle = "#1e3452";
        ctx.fillRect(-14, -6 + (this.isMoving ? fMod : 0), 6, 3);
        ctx.fillRect(-14, 3 - (this.isMoving ? fMod : 0), 6, 3);

        // Tanque de Oxigênio nas costas
        ctx.fillStyle = "#466e8c";
        ctx.fillRect(-8, -8, 6, 16);

        // Corpo do Traje Espacial/Mergulho
        ctx.fillStyle = "#28506e";
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fill();

        // Visor brilhante (Olhando para a direita por padrão no eixo 0 de rotação)
        ctx.fillStyle = GLOW_BLUE;
        ctx.beginPath();
        ctx.arc(5, 0, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

class Particula {
    constructor(x, y, cor, raioMax = 3) {
        this.x = x;
        this.y = y;
        this.cor = cor;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.life = 1.0;
        this.raio = Math.random() * raioMax + 1;
    }
    atualizar() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.02;
    }
    desenhar(camX, camY) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.cor;
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y - camY, this.raio, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class SonarPulse {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.raio = 0;
        this.raioMax = 450;
        this.ativo = true;
    }
    atualizar() {
        this.raio += 6;
        if (this.raio > this.raioMax) this.ativo = false;
    }
    desenhar(camX, camY) {
        if (!this.ativo) return;
        ctx.save();
        let alfa = 1 - (this.raio / this.raioMax);
        ctx.strokeStyle = GLOW_GREEN;
        ctx.globalAlpha = alfa;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y - camY, this.raio, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
}

class MonstroAbissal {
    constructor() {
        this.reposicionar();
        this.estado = "PATRULHA";
        this.velocidade = 1.0;
        this.angulo = Math.random() * Math.PI * 2;
        this.animFrame = Math.random() * 10;
        this.aggroTimer = 0;
    }

    reposicionar() {
        // Evita nascer preso dentro de blocos
        this.x = Math.random() * (LARGURA_MUNDO - 400) + 200;
        this.y = Math.random() * (ALTURA_MUNDO - 400) + 200;
    }

    atualizar(jogador, sonar) {
        this.animFrame += 0.15;
        let distJogador = Math.hypot(jogador.x - this.x, jogador.y - this.y);

        // Lógica de IA do GDD: Atração por ondas de Sonar
        if (sonar && sonar.ativo) {
            let distOnda = Math.hypot(sonar.x - this.x, sonar.y - this.y);
            if (Math.abs(distOnda - sonar.raio) < 35) {
                this.estado = "PERSEGUICAO";
                this.aggroTimer = 250;
            }
        }

        if (this.estado === "PERSEGUICAO") {
            this.angulo = Math.atan2(jogador.y - this.y, jogador.x - this.x);
            this.x += Math.cos(this.angulo) * (this.velocidade * 2.3);
            this.y += Math.sin(this.angulo) * (this.velocidade * 2.3);
            this.aggroTimer--;
            if (this.aggroTimer <= 0 && distJogador > 300) this.estado = "PATRULHA";
        } else {
            if (Math.random() < 0.02) this.angulo += (Math.random() - 0.5) * 2;
            this.x += Math.cos(this.angulo) * this.velocidade;
            this.y += Math.sin(this.angulo) * this.velocidade;
        }
    }

    desenhar(camX, camY, sonar) {
        let visivel = false;
        if (this.estado === "PERSEGUICAO") {
            visivel = true;
        } else if (sonar && sonar.ativo) {
            let d = Math.hypot(this.x - sonar.x, this.y - sonar.y);
            if (d < sonar.raio) visivel = true;
        }

        if (!visivel) return;

        ctx.save();
        ctx.translate(this.x - camX, this.y - camY);
        ctx.rotate(this.angulo);

        // Tentáculos orgânicos oscilantes
        let tMod = Math.sin(this.animFrame) * 5;
        ctx.fillStyle = "#961e1e";
        ctx.fillRect(-22, -8 + tMod, 12, 3);
        ctx.fillRect(-22, 5 - tMod, 12, 3);

        // Núcleo predador central
        ctx.fillStyle = GLOW_RED;
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ff8c00";
        ctx.beginPath();
        ctx.arc(3, 0, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

class CapsuleO2 {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.ativo = true;
        this.pulse = Math.random() * 5;
    }
    desenhar(camX, camY) {
        if (!this.ativo) return;
        this.pulse += 0.06;
        let tamMod = Math.sin(this.pulse) * 3;

        ctx.save();
        // Base da Planta
        ctx.fillStyle = "#145a3c";
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y - camY, 14, 0, Math.PI * 2);
        ctx.fill();
        
        // Núcleo de Oxigênio
        ctx.fillStyle = GLOW_GREEN;
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y - camY, 7 + tamMod, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// --- CONSTRUÇÃO DO MAPA ---
function inicializarMapa() {
    // Paredes das bordas do mapa abissal
    obstáculos.push({ x: 0, y: 0, w: LARGURA_MUNDO, h: 40 });
    obstáculos.push({ x: 0, y: ALTURA_MUNDO - 40, w: LARGURA_MUNDO, h: 40 });
    obstáculos.push({ x: 0, y: 0, w: 40, h: ALTURA_MUNDO });
    obstáculos.push({ x: LARGURA_MUNDO - 40, y: 0, w: 40, h: ALTURA_MUNDO });

    // Colunas internas (Labirinto de Cavernas)
    for (let i = 0; i < 25; i++) {
        let w = Math.floor(Math.random() * 200) + 150;
        let h = Math.floor(Math.random() * 200) + 150;
        let x = Math.floor(Math.random() * (LARGURA_MUNDO - 500)) + 200;
        let y = Math.floor(Math.random() * (ALTURA_MUNDO - 500)) + 200;

        // Manter a área de spawn central limpa de obstáculos
        let spawnZone = { x: LARGURA_MUNDO / 2 - 200, y: ALTURA_MUNDO / 2 - 200, w: 400, h: 400 };
        if (!(x < spawnZone.x + spawnZone.w && x + w > spawnZone.x && y < spawnZone.y + spawnZone.h && y + h > spawnZone.y)) {
            obstáculos.push({ x, y, w, h });
        }
    }

    // Criar cápsulas de O2 pelo mapa limpo
    for (let i = 0; i < 12; i++) {
        let rx = Math.random() * (LARGURA_MUNDO - 200) + 100;
        let ry = Math.random() * (ALTURA_MUNDO - 200) + 100;
        pods.push(new CapsuleO2(rx, ry));
    }

    // Instanciar monstros
    for (let i = 0; i < 12; i++) {
        monstros.push(new MonstroAbissal());
    }
}

function dispararSonar() {
    if (gameOver) return;
    sonares.push(new SonarPulse(jogador.x, jogador.y));
    camShake = 14; // Efeito visual de tremor
}

// --- SETUP INICIAL ---
const jogador = new Jogador();
inicializarMapa();

// --- LOOP PRINCIPAL DO JOGO ---
function loop() {
    if (!gameOver) {
        // Updates
        jogador.atualizar();
        let activeSonar = sonares.length > 0 ? sonares[sonares.length - 1] : null;

        sonares.forEach((s, index) => {
            s.atualizar();
            if (!s.ativo) sonares.splice(index, 1);
        });

        monstros.forEach(m => {
            m.atualizar(jogador, activeSonar);
            
            // Colisão com monstro (Dano tira oxigênio)
            let d = Math.hypot(jogador.x - m.x, jogador.y - m.y);
            if (d < 22) {
                jogador.oxigenio -= 0.5;
                partículas.push(new Particula(jogador.x, jogador.y, GLOW_RED, 4));
            }
        });

        pods.forEach(p => {
            if (p.ativo && jogador.oxigenio < 100) {
                let d = Math.hypot(jogador.x - p.x, jogador.y - p.y);
                if (d < 30) {
                    jogador.oxigenio = Math.min(100, jogador.oxigenio + 35);
                    p.active = false;
                    p.ativo = false;
                }
            }
        });

        partículas.forEach((pt, index) => {
            pt.atualizar();
            if (pt.life <= 0) partículas.splice(index, 1);
        });

        // Configuração de Câmera de perseguição fluida
        let camX = jogador.x - canvas.width / 2;
        let camY = jogador.y - canvas.height / 2;
        camX = Math.max(0, Math.min(camX, LARGURA_MUNDO - canvas.width));
        camY = Math.max(0, Math.min(camY, ALTURA_MUNDO - canvas.height));

        if (camShake > 0) {
            camX += (Math.random() - 0.5) * camShake;
            camY += (Math.random() - 0.5) * camShake;
            camShake -= 0.8;
        }

        // --- RENDERIZAÇÃO ---
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = ABYSS_DEEP;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grade de Fundo
        ctx.strokeStyle = "#081628";
        ctx.lineWidth = 1;
        let spacing = 64;
        
        for (let x = (camX % spacing); x < canvas.width; x += spacing) {
            ctx.beginPath(); 
            ctx.moveTo(x, 0); 
            ctx.lineTo(x, canvas.height); 
            ctx.stroke();
        }
        for (let y = (camY % spacing); y < canvas.height; y += spacing) {
            ctx.beginPath(); 
            ctx.moveTo(0, y); 
            ctx.lineTo(canvas.width, y); 
            ctx.stroke();
        }

        // Desenhar Obstáculos / Cavernas
        ctx.fillStyle = WALL_COLOR;
        ctx.strokeStyle = WALL_BORDER;
        ctx.lineWidth = 2;
        obstáculos.forEach(obs => {
            ctx.fillRect(obs.x - camX, obs.y - camY, obs.w, obs.h);
            ctx.strokeRect(obs.x - camX, obs.y - camY, obs.w, obs.h);
        });

        // Desenhar Elementos
        pods.forEach(p => p.draw(camX, camY));
        monstros.forEach(m => m.draw(camX, camY, activeSonar));
        partículas.forEach(pt => pt.draw(camX, camY));
        jogador.desenhar(camX, camY);
        sonares.forEach(s => s.draw(camX, camY));

        // --- MÁSCARA DE ILUMINAÇÃO (Lanterna do Mergulhador) ---
        let maskCanvas = document.createElement('canvas');
        maskCanvas.width = canvas.width;
        maskCanvas.height = canvas.height;
        let mCtx = maskCanvas.getContext('2d');
        
        mCtx.fillStyle = "rgba(2, 5, 12, 0.85)"; // Escuridão abissal
        mCtx.fillRect(0, 0, canvas.width, canvas.height);

        // Círculo de luz gradiente da lanterna
        let jScX = jogador.x - camX;
        let jScY = jogador.y - camY;
        let grad = mCtx.createRadialGradient(jScX, jScY, 20, jScX, jScY, 150);
        grad.addColorStop(0, "rgba(0,0,0,1)");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        
        mCtx.globalCompositeOperation = 'destination-out';
        mCtx.fillStyle = grad;
        mCtx.beginPath();
        mCtx.arc(jScX, jScY, 150, 0, Math.PI * 2);
        mCtx.fill();
        ctx.drawImage(maskCanvas, 0, 0);

        // --- HUD INTERFACE ---
        // Barra de Oxigênio
        ctx.fillStyle = "rgba(20, 25, 35, 0.8)";
        ctx.fillRect(30, 30, 220, 24);
        
        let o2Cor = jogador.oxigenio > 35 ? GLOW_GREEN : GLOW_RED;
        ctx.fillStyle = o2Cor;
        ctx.fillRect(34, 34, Math.max(0, jogador.oxigenio * 2.12), 16);
        
        ctx.fillStyle = "#fff";
        ctx.font = "bold 14px Consolas";
        ctx.textAlign = "left";
        ctx.fillText(`SISTEMA-O2: ${Math.max(0, Math.floor(jogador.oxigenio))}%`, 34, 72);
        
        ctx.fillStyle = "rgba(100, 130, 160, 0.7)";
        ctx.fillText("[WASD / Setas] Natação | [ESPAÇO] Pulso de Sonar", 30, canvas.height - 30);

        // Morte
        if (jogador.oxigenio <= 0) {
            gameOver = true;
        }
    } else {
        // Tela de Game Over
        ctx.fillStyle = "rgba(6, 2, 2, 0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = GLOW_RED;
        ctx.font = "bold 38px Consolas";
        ctx.textAlign = "center";
        ctx.fillText("SINAL DE TRANSMISSÃO PERDIDO", canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.fillStyle = "#aaa";
        ctx.font = "16px Consolas";
        ctx.fillText("O oxigênio do traje esgotou. Kai foi consumido pela fenda abissal.", canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillText("Atualize a página para reiniciar a missão.", canvas.width / 2, canvas.height / 2 + 60);
    }
    
    requestAnimationFrame(loop);
}

// Inicia o jogo
requestAnimationFrame(loop);
